{% extends 'base.html' %}

{% block title %}Leaderboard{% endblock %}

{% block content %}
<div class="leaderboard-container">
    <h1>Leaderboard</h1>
    
    <div class="leaderboard-table">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team Name</th>
                    <th>Members</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                {% for team in teams %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ team.name }}</td>
                    <td>{{ team.members }}</td>
                    <td>{{ team.score }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="no-teams">No teams registered yet</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
