<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="/static/img/logo.png" alt="Treasure Hunt Logo">
            </div>
            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                {% if user.is_authenticated %}
                    {% if user.is_superuser %}
                        <a href="{% url 'admin_page' %}">Admin Monitor</a>
                    {% else %}
                        <a href="{% url 'question' %}">Current Question</a>
                        <a href="{% url 'leaderboard' %}">Leaderboard</a>
                    {% endif %}
                    <a href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'home' %}">Home</a>
                    <a href="{% url 'rules' %}">Rules</a>
                    <a href="{% url 'register' %}">Register</a>
                    <a href="{% url 'login' %}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; WhoDunIt Frosh TIET 2025</p>
    </footer>
</body>
</html>
